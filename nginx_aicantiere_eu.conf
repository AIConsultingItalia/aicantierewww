# 1. Redirect HTTP -> HTTPS www.aicantiere.eu
server {
    listen 80;
    listen [::]:80;
    server_name aicantiere.eu www.aicantiere.eu;
    return 301 https://www.aicantiere.eu$request_uri;
}

# 2. Redirect HTTPS non-www (aicantiere.eu) -> HTTPS www.aicantiere.eu
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aicantiere.eu;

    ssl_certificate /etc/letsencrypt/live/aicantierewww/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicantierewww/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.aicantiere.eu$request_uri;
}

# 3. Canonical HTTPS www.aicantiere.eu
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.aicantiere.eu;

    root /var/www/aicantierewww;
    index index.html;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    ssl_certificate /etc/letsencrypt/live/aicantierewww/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aicantierewww/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
